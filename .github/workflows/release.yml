name: Release
# Push a tag like v1.2.3 -> builds every platform package and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v); artifacts are uploaded but no release is created'
        required: false

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      # tar.gz + .deb + AppImage (appimagetool downloaded by the script; extract-and-run, no FUSE needed)
      - run: ./installer/build.sh -r ${{ matrix.rid }} --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.rid }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.AppImage

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build portable zip + Setup.exe
        shell: pwsh
        run: |
          $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          ./installer/build.ps1 -Rid ${{ matrix.rid }} -Version "$env:VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*-Setup.exe

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      # Optional signing / notarization: define these repository secrets to enable.
      - name: Import signing certificate (optional)
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Build .app + .dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: ./installer/build.sh -r ${{ matrix.rid }} --version "$VERSION"
      - name: Notarize (optional)
        if: ${{ env.NOTARY_APPLE_ID != '' }}
        env:
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials ci --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          for d in artifacts/*.dmg; do
            xcrun notarytool submit "$d" --keychain-profile ci --wait
            xcrun stapler staple "$d"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.rid }}
          path: |
            artifacts/*.dmg
            artifacts/*.app.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
