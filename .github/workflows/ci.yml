name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Ddt4All.sln
      - run: dotnet build Ddt4All.sln -c Release --no-restore
      # Benchmarks project is built but not executed.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Ddt4All.sln -c Release --no-build --logger "trx;LogFileName=test.trx" --logger "console;verbosity=normal" --results-directory TestResults 2>&1 | tee test.log
      - name: Report failed tests as annotations
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for f in glob.glob("**/*.trx", recursive=True):
              for r in ET.parse(f).getroot().iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") == "Failed":
                      m = r.find(".//t:Message", ns)
                      msg = " ".join((m.text or "").split())[:400] if m is not None else ""
                      print(f"::error title=FAILED {r.get('testName')}::{msg}")
          import re
          for line in open("test.log", errors="replace"):
              if re.search(r"(Failed|Aborted|crash|error|Exception|Unhandled|exit code)", line, re.I) and "warning" not in line.lower():
                  print("::error title=LOG::" + line.strip()[:300])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore

  package-smoke:
    name: package smoke (linux .deb + tar.gz)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: SKIP_APPIMAGE=1 ./installer/build.sh -r linux-x64
      - run: dpkg-deb --info artifacts/*.deb && dpkg-deb --contents artifacts/*.deb
